<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алмаз Потолок — натяжные потолки</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #fff;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      width: 260px;
      max-width: 90%;
      height: auto;
    }

    .hero {
      background: #fff;
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      margin: 0 0 15px;
      font-size: 42px;
    }

    .hero p {
      margin: 0 auto 25px;
      max-width: 700px;
      color: #666;
      font-size: 18px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 16px 30px;
      background: #111;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      opacity: .85;
    }

    .calculator-section {
      display: none;
      padding: 30px 15px 60px;
      background: #f5f5f5;
    }

    .calculator-section h2 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 30px;
    }

    .calculator-frame {
      width: 100%;
      max-width: 1000px;
      height: 1200px;
      margin: 0 auto;
      display: block;
      border: 0;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    .contacts {
      text-align: center;
      padding: 40px 20px;
      background: #111;
    }

    .contacts a {
      color: #fff;
      margin: 5px 10px;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      .calculator-frame {
        height: 1400px;
      }
    }
  </style>
</head>

<body>

<header>
  <img
    class="logo"
    src="almaz-logo-original-clean.png"
    alt="Алмаз Потолок"
  >
</header>

<section class="hero">

  <h1>Натяжные потолки</h1>

  <p>
    Изготовление и монтаж натяжных потолков.
    Рассчитайте предварительную стоимость прямо на сайте.
  </p>

  <button
    class="button"
    onclick="openCalculator()"
  >
    РАССЧИТАТЬ СТОИМОСТЬ
  </button>

</section>


<section
  id="calculator"
  class="calculator-section"
>

  <h2>Калькулятор натяжных потолков</h2>

  <iframe
    class="calculator-frame"
    src="../calculator.html"
    title="Калькулятор натяжных потолков"
  ></iframe>

</section>


<div class="contacts">

  <a href="tel:+79818900682">
    📞 +7 981 890-06-82
  </a>

  <a
    href="https://vk.ru/potolokalmaz"
    target="_blank"
  >
    VK
  </a>

</div>


<script>
  function openCalculator() {
    const calculator = document.getElementById("calculator");

    calculator.style.display = "block";

    calculator.scrollIntoView({
      behavior: "smooth"
    });
  }
</script>

</body>
</html>
