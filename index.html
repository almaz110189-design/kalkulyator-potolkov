<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Алмаз Потолок — натяжные потолки</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #111;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;

      background:
        linear-gradient(
          rgba(0,0,0,0.65),
          rgba(0,0,0,0.78)
        ),
        url("site/almaz-logo-original-clean.png") center / cover no-repeat;

      background-color: #171717;
    }

    .content {
      width: 100%;
      max-width: 850px;
      padding: 45px 30px;
      border-radius: 25px;
      background: rgba(20,20,20,0.82);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      width: 280px;
      max-width: 80%;
      height: auto;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 15px;
      font-size: 20px;
      color: #ddd;
    }

    .line {
      width: 70px;
      height: 3px;
      background: #fff;
      margin: 28px auto;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 30px;
    }

    .description {
      max-width: 650px;
      margin: 0 auto 32px;
      font-size: 17px;
      line-height: 1.6;
      color: #d5d5d5;
    }

    .main-button {
      display: inline-block;
      padding: 18px 38px;
      border-radius: 12px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: 0.2s;
    }

    .main-button:hover {
      transform: translateY(-2px);
    }

    .contacts {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .contact {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.08);
    }

    .note {
      margin-top: 28px;
      color: #999;
      font-size: 14px;
    }

    @media (max-width: 600px) {

      .content {
        padding: 35px 20px;
      }

      h1 {
        font-size: 31px;
      }

      h2 {
        font-size: 25px;
      }

      .subtitle {
        font-size: 17px;
      }

      .main-button {
        width: 100%;
        padding: 17px 15px;
      }

      .logo {
        width: 230px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="content">

      <img
        class="logo"
        src="site/almaz-logo-original-clean.png"
        alt="Алмаз Потолок"
      >

      <h1>Натяжные потолки</h1>

      <div class="subtitle">
        Изготовление и монтаж натяжных потолков
      </div>

      <div class="line"></div>

      <h2>Рассчитайте стоимость</h2>

      <p class="description">
        Сделайте предварительный расчёт стоимости натяжного потолка
        с учётом площади, профиля, светильников и дополнительных работ.
      </p>

      <a
        class="main-button"
        href="calculator.html"
      >
        РАССЧИТАТЬ СТОИМОСТЬ
      </a>

      <div class="contacts">

        <a
          class="contact"
          href="tel:+79818900682"
        >
          📞 Позвонить
        </a>

        <a
          class="contact"
          href="https://vk.ru/potolokalmaz"
          target="_blank"
        >
          VK
        </a>

      </div>

      <div class="note">
        Окончательная стоимость уточняется после замера.
      </div>

    </div>

  </section>

</body>
</html>
